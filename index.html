<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kppcn</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    :root {
      --md-sys-color-background: #0f0d13;
      --md-sys-color-surface: #1d1924;
      --md-sys-color-primary: #d0bcff;
      --md-sys-color-on-surface: #e6e1e5;
      --md-sys-color-on-surface-variant: #cac4d0;
      --md-sys-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-header {
      text-align: center;
      margin-bottom: 36px;
      width: 100%;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 36px;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: var(--md-sys-elevation-1);
    }
    .title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--md-sys-color-primary);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 400;
    }
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-pill {
      display: grid;
      grid-template-columns: 24px 1fr 24px;
      align-items: center;
      width: 100%;
      background-color: var(--md-sys-color-surface);
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
      padding: 18px 24px;
      border-radius: 100px;
      box-shadow: var(--md-sys-elevation-1);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease;
    }
    .link-pill:hover, .link-pill:active {
      transform: scale(1.02);
      background-color: #282234;
    }
    .link-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      fill: currentColor;
      color: var(--md-sys-color-primary);
      border-radius: 4px;
      object-fit: cover;
    }
    .link-text {
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.1px;
    }
    .spacer {
      width: 24px;
    }
    @media (max-width: 400px) {
      body {
        padding: 24px 12px;
      }
      .link-pill {
        padding: 16px 20px;
      }
      .title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="profile-header">
      <img src="https://raw.githubusercontent.com/kappucin/site/refs/heads/main/cat.jpg" alt="Avatar" class="avatar">
      <h1 class="title">kppcn</h1>
      <p class="subtitle">aka kp9n, 9cn, kappucino</p>
    </header>
    <main class="links-list" id="links-container"></main>
  </div>
  <script>
    const LINKS_DATA = [
      {
        text: 'telegram',
        url: 'https://t.me/kppcm',
        customColor: '#74a2ff'
      },
      {
        text: 'github',
        url: 'https://github.com/kappucin',
      },
      {
        text: 'youtube',
        url: 'https://youtube.com/@yhreehunderedd',
        customColor: '#ff0000'
      },
      {
        text: 'email',
        url: 'mailto:kappucino@tuta.io',
      },
      {
        text: 'tangled',
        url: 'https://tangled.org/ima.kppcn.cyou'
      }
    ];

    function renderLinks() {
      const container = document.getElementById('links-container');
      container.innerHTML = LINKS_DATA.map(link => {
        const iconStyle = link.customColor ? `style="color: ${link.customColor};"` : '';
        let mediaElement = '<span class="link-icon"></span>';
        
        if (link.icon) {
          mediaElement = `<span class="link-icon" ${iconStyle}>${link.icon}</span>`;
        } else if (link.imgUrl) {
          mediaElement = `<img src="${link.imgUrl}" class="link-icon" alt="">`;
        }

        return `
          <a href="${link.url}" class="link-pill" target="_blank" rel="noopener noreferrer">
            ${mediaElement}
            <span class="link-text">${link.text}</span>
            <span class="spacer"></span>
          </a>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderLinks);
  </script>
</body>
</html>
