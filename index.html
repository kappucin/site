<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>kppcn</title>
<style>
:root {
    --bg: #c0c0c0;
    --fg: #000000;
    --link: #0000ee;
    --vlink: #551a8b;
    --win-border: #ffffff #808080 #808080 #ffffff;
}
body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: "Times New Roman", Times, serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}
#bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
}
.matrix-text {
    position: absolute;
    font-family: "Courier New", monospace;
    color: #008000;
    font-size: 12px;
    opacity: 0.2;
}
main {
    background: var(--bg);
    border: 2px solid;
    border-color: var(--win-border);
    padding: 20px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 2px 2px 0 #000;
}
h1 {
    font-size: 2em;
    margin: 0 0 10px 0;
    background: #000080;
    color: #fff;
    padding: 5px;
    text-transform: none;
}
h2 {
    font-size: 1.2em;
    text-decoration: underline;
    margin-top: 20px;
}
a {
    color: var(--link);
    text-decoration: underline;
}
a:visited {
    color: var(--vlink);
}
ul {
    list-style-type: square;
    display: inline-block;
    text-align: left;
    padding-left: 20px;
}
li {
    margin: 5px 0;
}
.blink {
    text-decoration: blink;
}
marquee {
    border: 1px inset #808080;
    background: #fff;
    margin-top: 20px;
}
</style>
</head>

<script>
const bg = document.getElementById('bg-layer');

for (let i = 0; i < 12; i++) {
