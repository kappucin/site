<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kppcn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px 14px;
      color:#eee;
      font-family:"Roboto Condensed",Arial,sans-serif;
      background:#000;
    }
    main{width:min(100%,520px)}
    .bio-card,.buttons-card{
      width:100%;
      background:#171717;
      border:1px solid #2c2c2c;
      border-radius:18px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
    }
    .bio-card{
      padding:28px;
      text-align:center;
    }
    .buttons-card{
      margin-top:14px;
      padding:14px;
    }
    .links,.buttons{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
    }
    .links{
      gap:8px;
    }
    .links a{
      padding:7px 12px;
      color:#fff;
      text-decoration:none;
      background:#242424;
      border:1px solid #383838;
      border-radius:999px;
    }
    .links a:hover{background:#303030}
    .buttons{gap:7px}
    .buttons img{
      width:88px;
      height:31px;
      display:block;
      border:1px solid #111;
      image-rendering:pixelated;
    }
    @media (max-width:420px){
      .bio-card{padding:22px 18px}
    }
  </style>
</head>
<body>
  <main>
    <section class="bio-card">
      <nav class="links" aria-label="social links">
        <a href="https://t.me/three_one_4">telegram</a>
        <a href="https://github.com/kappucin">github</a>
        <a href="https://tangled.org/kppcn.tngl.sh">tangled</a>
        <a href="https://youtube.com/@kppcn">youtube</a>
        <a href="mailto:kappucino@tuta.io">email</a>
      </nav>
    </section>

    <section class="buttons-card" aria-label="88x31 buttons">
      <div class="buttons">
        <a target="_blank" rel="noreferrer"><img src="https://atapi.space/assets/img/buttons/sucks.gif" loading="lazy" width="88" height="31" alt="sucks"></a>
        <a target="_blank" rel="noreferrer"><img src="https://cyber.dabamos.de/88x31/redhat1.gif" loading="lazy" width="88" height="31" alt="rh"></a>
        <a target="_blank" rel="noreferrer"><img src="https://atapi.space/assets/img/buttons/steam.gif" loading="lazy" width="88" height="31" alt="steam"></a>
