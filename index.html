<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kppcn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: #09090b;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: "Roboto Condensed", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    .rain-drop {
      position: absolute;
      top: 0;
      left: 0;
      text-decoration: none;
      color: #ffffff;
      white-space: nowrap;
      user-select: none;
      will-change: transform;
      transition: color 0.15s ease, opacity 0.15s ease;
    }

    .rain-drop:hover {
      color: #00ffd2 !important;
      opacity: 1 !important;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <script>
    const linksData = [
      { text: 'telegram', url: 'https://t.me/three_one_4' },
      { text: 'github', url: 'https://github.com/kappucin' },
      { text: 'tangled', url: 'https://tangled.org/ima.kppcn.cyou' },
      { text: 'youtube', url: 'https://youtube.com/@kppcn' },
      { text: 'email', url: 'mailto:kappucino@tuta.io' }
    ];

    const totalDrops = 40;
    const dropsArray = [];

    for (let i = 0; i < totalDrops; i++) {
      const data = linksData[Math.floor(Math.random() * linksData.length)];
      const a = document.createElement('a');
      
      a.href = data.url;
      a.textContent = data.text;
      a.className = 'rain-drop';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      
      const size = 13 + Math.random() * 15;
      a.style.fontSize = size + 'px';
      a.style.opacity = 0.07 + (size - 13) / 15 * 0.45;
      document.body.appendChild(a);
      dropsArray.push({
        element: a,
        x: Math.random() * (window.innerWidth - 120),
        y: Math.random() * (window.innerHeight + 200) - 100,
        speed: 1.5 + (size - 13) / 15 * 2.5
      });
    }
    function animate() {
      const screenHeight = window.innerHeight;
      const screenWidth = window.innerWidth;
      for (let i = 0; i < totalDrops; i++) {
        const drop = dropsArray[i];
        drop.y += drop.speed;
        if (drop.y > screenHeight + 40) {
          drop.y = -40;
          drop.x = Math.random() * (screenWidth - 120);
          const nextData = linksData[Math.floor(Math.random() * linksData.length)];
          drop.element.href = nextData.url;
          drop.element.textContent = nextData.text;
        }
        drop.element.style.transform = 'translate3d(' + drop.x + 'px, ' + drop.y + 'px, 0)';
      }

      requestAnimationFrame(animate);
    }
    window.addEventListener('resize', () => {
      for (let i = 0; i < totalDrops; i++) {
        if (dropsArray[i].x > window.innerWidth - 120) {
          dropsArray[i].x = Math.random() * (window.innerWidth - 120);
        }
      }
    });
    animate();
  </script>
</body>
</html>
