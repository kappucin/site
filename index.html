<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kppcn</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    :root {
      --md-sys-color-background: #0f0d13;
      --md-sys-color-surface: #1d1924;
      --md-sys-color-primary: #d0bcff;
      --md-sys-color-on-surface: #e6e1e5;
      --md-sys-color-on-surface-variant: #cac4d0;
      --md-sys-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-header {
      text-align: center;
      margin-bottom: 36px;
      width: 100%;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 36px;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: var(--md-sys-elevation-1);
    }
    .title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--md-sys-color-primary);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 400;
    }
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-pill {
      display: grid;
      grid-template-columns: 24px 1fr 24px;
      align-items: center;
      width: 100%;
      background-color: var(--md-sys-color-surface);
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
      padding: 18px 24px;
      border-radius: 100px;
      box-shadow: var(--md-sys-elevation-1);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease;
    }
    .link-pill:hover, .link-pill:active {
      transform: scale(1.02);
      background-color: #282234;
    }
    .link-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      fill: currentColor;
      color: var(--md-sys-color-primary);
      border-radius: 4px;
      object-fit: cover;
    }
    .link-text {
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.1px;
    }
    .spacer {
      width: 24px;
    }
    @media (max-width: 400px) {
      body {
        padding: 24px 12px;
      }
      .link-pill {
        padding: 16px 20px;
      }
      .title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="profile-header">
      <img src="https://raw.githubusercontent.com/kappucin/site/refs/heads/main/cat.jpg" alt="Avatar" class="avatar">
      <h1 class="title">kppcn</h1>
      <p class="subtitle">aka kp9n, 9cn, kappucino</p>
    </header>
    <main class="links-list" id="links-container"></main>
  </div>
  <script>
    const LINKS_DATA = [
      {
        text: 'telegram',
        url: 'https://t.me/kppcm',
        icon: '<svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.562 8.161c-.18.196-4.948 4.904-7.468 7.394-.275.27-.533.404-.774.399-.24-.005-.468-.124-.716-.204-.337-.11-.79-.253-1.127-.365-.457-.152-.816-.231-.784-.504.016-.142.213-.288.591-.44 2.333-1.01 5.556-2.36 9.664-4.053.428-.176.818-.261 1.168-.255.4-.006.732.14.975.385.204.205.281.488.243.834a3.142 3.142 0 0 1-.772 1.209z"/></svg>',
        customColor: '#74a2ff'
      },
      {
        text: 'github',
        url: 'https://github.com/kappucin',
        icon: '<svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>'
      },
      {
        text: 'youtube',
        url: 'https://youtube.com/@yhreehunderedd',
        icon: '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
        customColor: '#ff0000'
      },
      {
        text: 'email',
        url: 'mailto:kappucino@tuta.io',
        icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
      },
      {
        text: 'tangled',
        url: 'https://tangled.org/ima.kppcn.cyou'
      }
    ];

    function renderLinks() {
      const container = document.getElementById('links-container');
      container.innerHTML = LINKS_DATA.map(link => {
        const iconStyle = link.customColor ? `style="color: ${link.customColor};"` : '';
        let mediaElement = '<span class="link-icon"></span>';
        
        if (link.icon) {
          mediaElement = `<span class="link-icon" ${iconStyle}>${link.icon}</span>`;
        } else if (link.imgUrl) {
          mediaElement = `<img src="${link.imgUrl}" class="link-icon" alt="">`;
        }

        return `
          <a href="${link.url}" class="link-pill" target="_blank" rel="noopener noreferrer">
            ${mediaElement}
            <span class="link-text">${link.text}</span>
            <span class="spacer"></span>
          </a>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderLinks);
  </script>
</body>
</html>
